[Service]
Environment=RUST_SELECTED_CANDIDATE_ECONOMIC_VALIDATION_MODE=true
Environment=RUST_SELECTED_CANDIDATE_DRAIN_VALIDATION_MODE=false
Environment=RUST_SELECTED_CANDIDATE_MAX_SESSION_BUYS=125
Environment=RUST_SELECTED_CANDIDATE_MAX_LANDED_BUYS=50
