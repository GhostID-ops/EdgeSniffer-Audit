ExecStartPre=
ExecStartPre=/usr/bin/mkdir -p /var/lib/edgesniffer-teacher-impulse-parity-v1/live-rule-a-econ-v1-20260902T153000Z
ExecStartPre=/usr/bin/bash -lc 'set -euo pipefail; buy_lamports=1000000; cap_enabled="${RUST_SELECTED_CANDIDATE_CAP_FEE_OVERRIDES_ENABLED:-}"; max_pct="${RUST_SELECTED_CANDIDATE_MAX_FEE_PCT_OF_BUY:-}"; buy_priority="${RUST_SELECTED_CANDIDATE_BUY_PRIORITY_FEE_MICRO_LAMPORTS:-}"; buy_jito="${RUST_SELECTED_CANDIDATE_BUY_JITO_TIP_LAMPORTS:-}"; buy_helius="${RUST_SELECTED_CANDIDATE_BUY_HELIUS_TIP_LAMPORTS:-}"; sell_priority="${RUST_SELECTED_CANDIDATE_SELL_PRIORITY_FEE_MICRO_LAMPORTS:-}"; sell_jito="${RUST_SELECTED_CANDIDATE_SELL_JITO_TIP_LAMPORTS:-}"; sell_helius="${RUST_SELECTED_CANDIDATE_SELL_HELIUS_TIP_LAMPORTS:-}"; test "$cap_enabled" = true; test "$max_pct" = 10; test -n "$buy_priority"; test -n "$buy_jito"; test -n "$buy_helius"; test -n "$sell_priority"; test -n "$sell_jito"; test -n "$sell_helius"; test "${RUST_SELECTED_CANDIDATE_BUY_USE_HOT_FEE_PROFILE:-}" = false; test "${RUST_SELECTED_CANDIDATE_SELL_USE_HOT_FEE_PROFILE:-}" = false; test "${RUST_SELECTED_CANDIDATE_ENFORCE_ZERO_EXECUTION_FEES:-}" = true; test "${RUST_SELECTED_CANDIDATE_ENFORCE_ZERO_SELL_FEES:-}" = true; max_fee=$((buy_lamports * 10 / 100)); buy_optional=$((buy_jito + buy_helius + (buy_priority * 1400000 + 999999) / 1000000)); sell_optional=$((sell_jito + sell_helius + (sell_priority * 1400000 + 999999) / 1000000)); test "$buy_optional" -eq 0; test "$sell_optional" -eq 0; echo "{\"kind\":\"ruleADustFeeGuardVerified\",\"sessionLabel\":\"RULE_A_LIVE_ECON_V1\",\"fingerprint\":\"grossbuy_1s_ge5\",\"buySol\":0.001,\"buyLamports\":$buy_lamports,\"feeCapEnabled\":true,\"maxFeePctOfBuy\":10,\"maxOptionalFeeLamports\":$max_fee,\"buyJitoTipLamports\":$buy_jito,\"buyHeliusTipLamports\":$buy_helius,\"buyPriorityFeeMicroLamports\":$buy_priority,\"buyOptionalFeeLamports\":$buy_optional,\"sellJitoTipLamports\":$sell_jito,\"sellHeliusTipLamports\":$sell_helius,\"sellPriorityFeeMicroLamports\":$sell_priority,\"sellOptionalFeeLamports\":$sell_optional}" >> /var/lib/edgesniffer-teacher-impulse-parity-v1/live-rule-a-econ-v1-20260902T153000Z/rust-selected-candidate-audit.jsonl'
StandardOutput=append:/var/lib/edgesniffer-teacher-impulse-parity-v1/live-rule-a-econ-v1-20260902T153000Z/stdout.jsonl
