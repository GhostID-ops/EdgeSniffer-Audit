[package]
name = "pumpfun-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
pump-exact-evidence-ledger = { path = "../.analysis_tmp/ledger_shim" }
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
futures = "0.3"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustls = { version = "0.23", features = ["ring"] }
solana-entry = { version = "=2.2.1", optional = true }
solana-compute-budget-interface = "=2.2.1"
solana-hash = "=2.2.1"
solana-instruction = "=2.2.1"
solana-keypair = "=2.2.1"
solana-message = "=2.2.1"
solana-pubkey = { version = "=2.2.1", features = ["curve25519", "sha2"] }
solana-signature = "=2.2.1"
solana-signer = "=2.2.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-transaction = { version = "=2.2.1", features = ["bincode"] }
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic-prost = "0.14"
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
yellowstone-grpc-proto = "=12.5.0"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3.20"

[[bin]]
name = "kefi-frozen-pump-curve-tape-materializer-v1"
path = "../kefi_frozen_pump_curve_tape_materializer_v1.rs"

[[bin]]
name = "kefi-frozen-pump-curve-selection-consumer-v1"
path = "../kefi_frozen_pump_curve_selection_consumer_v1.rs"

[[bin]]
name = "kefi-pump-curve-mint-boundary-cohort-v1"
path = "../kefi_pump_curve_mint_boundary_cohort_v1.rs"

[features]
default = []
jito-shredstream = [
  "dep:solana-entry",
]
