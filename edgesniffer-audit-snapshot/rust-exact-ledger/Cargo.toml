[package]
name = "pump-exact-evidence-ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3.3"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
futures = "0.3"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-entry = "=2.2.1"
solana-sdk = "=2.2.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
tonic-prost = "0.14"
yellowstone-grpc-proto = "=12.5.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.20"
