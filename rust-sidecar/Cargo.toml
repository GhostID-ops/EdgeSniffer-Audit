[package]
name = "pumpfun-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bs58 = "0.5"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
yellowstone-grpc-proto = "12.2"
