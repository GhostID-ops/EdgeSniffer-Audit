[package]
name = "pumpfun-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = { version = "1.3", optional = true }
bs58 = "0.5"
futures = "0.3"
openssl = { version = "0.10", features = ["vendored"], optional = true }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", features = ["ring"] }
solana-entry = { version = "=2.2.1", optional = true }
solana-instruction = { version = "=2.2.1", optional = true }
solana-message = { version = "=2.2.1", optional = true }
solana-transaction = { version = "=2.2.1", optional = true }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
tonic-prost = "0.14"
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
yellowstone-grpc-proto = "12.2"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[features]
default = []
jito-shredstream = [
  "dep:bincode",
  "dep:openssl",
  "dep:solana-entry",
  "dep:solana-instruction",
  "dep:solana-message",
  "dep:solana-transaction",
]
