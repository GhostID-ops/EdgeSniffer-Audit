[package]
name = "edgesniffer-pump-evidence-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
futures = "0.3"
prost = "0.14"
serde_json = "1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
yellowstone-grpc-proto = "=12.5.0"
